name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Standard runners only. macOS runs the full suite; tests/conftest.py skips tests marked
        # `macos` elsewhere and tests marked `posix` on Windows.
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --frozen --extra test
      - name: Run tests
        run: uv run --frozen pytest -q -p no:cacheprovider
